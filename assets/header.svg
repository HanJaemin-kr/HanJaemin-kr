<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Jaemin Han - Backend, Data & AI Developer">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="55%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <g id="gear">
      <g fill="currentColor">
        <rect x="-5" y="-49" width="10" height="15" rx="2"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(30)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(60)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(90)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(120)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(150)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(180)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(210)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(240)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(270)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(300)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(330)"/>
        <circle r="36"/>
      </g>
      <circle r="12" fill="#053B2C"/>
    </g>
  </defs>

  <rect width="1000" height="220" fill="url(#bgH)"/>

  <!-- left gear cluster -->
  <g transform="translate(140,120) scale(1.55)" color="#ffffff" opacity="0.20">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(262,62) scale(0.9)" color="#D1FAE5" opacity="0.32">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- right gear cluster -->
  <g transform="translate(872,106) scale(1.5)" color="#ffffff" opacity="0.20">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(752,158) scale(0.85)" color="#D1FAE5" opacity="0.32">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title -->
  <text x="500" y="103" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="6">JAEMIN HAN</text>
  <text x="500" y="143" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#ECFDF5" letter-spacing="3">Backend · Data · AI Developer · Industrial IoT · GenAI</text>
</svg>
