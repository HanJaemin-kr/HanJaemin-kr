<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="footer">
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <g id="gear">
      <g fill="currentColor">
        <rect x="-5" y="-49" width="10" height="15" rx="2"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(30)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(60)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(90)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(120)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(150)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(180)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(210)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(240)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(270)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(300)"/>
        <rect x="-5" y="-49" width="10" height="15" rx="2" transform="rotate(330)"/>
        <circle r="36"/>
      </g>
      <circle r="12" fill="#053B2C"/>
    </g>
  </defs>

  <rect width="1000" height="130" fill="url(#bgF)"/>

  <!-- gear row peeking from bottom -->
  <g transform="translate(140,140) scale(1.7)" color="#ffffff" opacity="0.18">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(255,112) scale(1.0)" color="#ECFDF5" opacity="0.28">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(500,150) scale(1.35)" color="#ffffff" opacity="0.16">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(745,112) scale(1.0)" color="#ECFDF5" opacity="0.28">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(860,140) scale(1.7)" color="#ffffff" opacity="0.18">
    <g>
      <use xlink:href="#gear"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="500" y="46" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ECFDF5" letter-spacing="5" opacity="0.9">SENSOR &#215; PLATFORM &#215; AI</text>
</svg>
