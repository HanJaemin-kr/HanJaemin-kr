name: Update OSS contributions

on:
  schedule:
    - cron: "7,37 * * * *"  # 30분마다 (GitHub 스케줄 지연 가능)
  workflow_dispatch:

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-oss.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile README [skip ci]"
          file_pattern: README.md
